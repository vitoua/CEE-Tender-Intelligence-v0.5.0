{% extends 'base.html' %}{% block c %}<h1>Аналітика завершених тендерів</h1><form class="bar"><select name="countries" multiple>{% for c in countries %}<option value="{{c}}" {% if c in selected %}selected{% endif %}>{{c}}</option>{% endfor %}</select><input name="date_from" type="date" value="{{date_from}}"><input name="date_to" type="date" value="{{date_to}}"><select name="sort_by"><option value="wins" {% if sort_by=='wins' %}selected{% endif %}>Кількість перемог</option><option value="value" {% if sort_by=='value' %}selected{% endif %}>Загальна вартість</option></select><select name="order"><option value="desc" {% if order=='desc' %}selected{% endif %}>За спаданням</option><option value="asc" {% if order=='asc' %}selected{% endif %}>За зростанням</option></select><button>Застосувати</button></form><div class="table"><b>Переможець</b><b>Перемог</b><b>Вартість</b><b>Частка</b>{% for r in rows %}<span>{{r.winner}}</span><span>{{r.wins}}</span><span>{{'%.2f'|format(r.total)}}</span><span>{{'%.1f'|format(r.share)}}%</span>{% endfor %}</div>{% endblock %}
