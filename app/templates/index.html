{% extends 'base.html' %}{% block c %}<form class="bar"><select name="country"><option value="">Усі країни</option>{% for c in countries %}<option {% if c==country %}selected{% endif %}>{{c}}</option>{% endfor %}</select><label><input type="checkbox" name="active_only" value="1" {% if active_only %}checked{% endif %}>Лише актуальні</label><button>Фільтрувати</button></form><div class="bar"><form method="post" action="/refresh/prozorro"><button>Оновити Prozorro</button></form><form method="post" action="/refresh/ted"><button>Оновити TED</button></form></div>{% for r in runs %}<p><b>{{r.source|upper}}</b>: {{r.status}} · {{r.count}} {{r.error}}</p>{% endfor %}<section class="grid">{% for x in rows %}<article><small>{{x.country}} · {{x.source}}</small><h3><a href="/tenders/{{x.id}}">{{x.title}}</a></h3><p>{{x.buyer}}</p><b>{{x.value or '—'}} {{x.currency}}</b></article>{% endfor %}</section>{% endblock %}
